name: Ultimate Android Builder (Java 21 Edition)
on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Lấy mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java 21 (Sửa lỗi invalid source release)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 3. Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Cài đặt thư viện (Dependencies)
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: 5. Đóng gói mã Web (Build Web)
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            mkdir -p dist
            cp -r * dist/ 2>/dev/null || true
          fi

      - name: 6. Dọn dẹp & Khởi tạo Capacitor
        run: |
          # Xóa sạch cấu hình cũ (.ts, .json) để tránh xung đột
          rm -f capacitor.config.ts
          rm -f capacitor.config.json
          
          # Tự tạo mã định danh (Package Name) từ tên Repo
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr -d '-' | tr '[:upper:]' '[:lower:]')
          
          # Khởi tạo Capacitor với thư mục web mặc định là 'dist'
          npx cap init "${{ inputs.app_name }}" "com.tontonyuta.$REPO_NAME" --web-dir dist
          
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: 7. Tự động xử lý Icon (Nếu có icon.png)
        run: |
          if [ -f "icon.png" ]; then
            npm install @capacitor/assets --save-dev
            npx capacitor-assets generate --android
          fi
          
          npx cap sync android

      - name: 8. Xuất file APK (Sử dụng Java 21)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Tải file APK lên GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7