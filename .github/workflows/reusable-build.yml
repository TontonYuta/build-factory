name: Ultimate Android Builder (Java 21 Edition)
on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
    # BƯỚC MỚI: Mở cổng nhận Mật mã Telegram
    secrets:
      TELEGRAM_TOKEN:
        required: false
      TELEGRAM_CHAT_ID:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Lấy mã nguồn (Checkout)
        uses: actions/checkout@v4

      - name: 2. Cài đặt Java 21 (Sửa lỗi invalid source release)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 3. Cài đặt Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 4. Cài đặt thư viện (Dependencies)
        run: npm install

      - name: 5. Đóng gói mã Web (Build Web)
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            mkdir -p dist
            cp -r * dist/ 2>/dev/null || true
          fi

      - name: 6. Dọn dẹp & Khởi tạo Capacitor
        run: |
          rm -f capacitor.config.ts
          rm -f capacitor.config.json
          
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr -d '-' | tr '[:upper:]' '[:lower:]')
          
          npx cap init "${{ inputs.app_name }}" "com.tontonyuta.$REPO_NAME" --web-dir dist
          
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: 7. Tự động xử lý Icon (Nếu có icon.png)
        run: |
          if [ -f "icon.png" ]; then
            npm install @capacitor/assets --save-dev
            npx capacitor-assets generate --android
          fi
          
          npx cap sync android

      - name: 8. Xuất file APK (Sử dụng Java 21)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 9. Tải file APK lên GitHub
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: 10. Gửi APK qua Telegram
        if: always()
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_PATH" ]; then
            curl -F document=@"$APK_PATH" \
                 -F caption="✅ App [${{ inputs.app_name }}] đã xuất xưởng! Tải về máy nhé Yuta." \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument?chat_id=${{ secrets.TELEGRAM_CHAT_ID }}"
          else
            curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
                 -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}&text=❌ Rất tiếc, App [${{ inputs.app_name }}] gặp sự cố trong lúc build rồi."
          fi
