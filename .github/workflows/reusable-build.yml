name: Ultimate Android Builder
on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'gradle' }

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }

      - name: Install Dependencies
        run: |
          # Thử dùng npm ci (nhanh hơn), nếu không có lock file thì dùng npm install
          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Web Code
        run: |
          # Nếu có lệnh build trong package.json thì chạy, nếu không thì tự tạo thư mục dist
          if npm run | grep -q "build"; then
            npm run build
          else
            mkdir -p dist
            cp -r * dist/ 2>/dev/null || true
          fi

      - name: Setup Capacitor & Icon
        run: |
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr -d '-' | tr '[:upper:]' '[:lower:]')
          # Khởi tạo Capacitor (force để tránh lỗi nếu đã có file config)
          npx cap init "${{ inputs.app_name }}" "com.tontonyuta.$REPO_NAME" --web-dir dist
          
          # Thêm platform Android nếu chưa có
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # Tự động tạo Icon nếu có icon.png
          if [ -f "icon.png" ]; then
            npm install @capacitor/assets --save-dev
            npx capacitor-assets generate --android
          fi
          
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk