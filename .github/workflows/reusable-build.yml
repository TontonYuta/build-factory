name: Ultimate Android Builder
on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin', cache: 'gradle' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }

      - name: Install & Build Web
        run: |
          npm ci
          npm run build

      - name: Setup Capacitor & Icon
        run: |
          # Tự động tạo Package Name từ tên Repo
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr -d '-' | tr '[:upper:]' '[:lower:]')
          npx cap init "${{ inputs.app_name }}" "com.tontonyuta.$REPO_NAME" --web-dir dist
          npx cap add android || true
          
          # Nếu có file icon.png trong repo app, nó sẽ tự tạo icon chuẩn Android
          if [ -f "icon.png" ]; then
            npm install @capacitor/assets --save-dev
            npx capacitor-assets generate --android
          fi
          
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk